<style>
:root {
  /* layout: one full-width stage with its words set straight on the picture; the open record and the notes sit below on slate */

  --slate: #171a20;
  --ink: #dde0e7;

  --ink-muted: #8a90a0;

  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.65; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; border-radius: 0; padding: 0; cursor: pointer; }
a { color: inherit; text-underline-offset: 3px; }
button:focus-visible, a:focus-visible { outline: 1px solid var(--hud); outline-offset: 3px; }
.mark::before { content: ""; display: inline-block; width: 12px; height: 1px; background: currentColor; transform: rotate(-58deg); margin-right: 6px; vertical-align: middle; }

.wrap { position: relative; }
.stage { position: relative; isolation: isolate; margin: 0; height: min(88vh, 66vw); min-height: 440px; overflow: hidden; background: #8f96a6; }
canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
canvas.dragging { cursor: grabbing; }
.stage::before, .stage::after { content: ""; position: absolute; left: 0; right: 0; pointer-events: none; z-index: 1; }
.stage::before { top: 0; height: 36%; background: linear-gradient(rgba(16, 18, 23, 0.5), rgba(16, 18, 23, 0)); }
.stage::after { bottom: 0; height: 40%; background: linear-gradient(rgba(16, 18, 23, 0), rgba(16, 18, 23, 0.66)); }
.grain { position: absolute; inset: 0; pointer-events: none; opacity: 0.11; mix-blend-mode: overlay; }
.fallback { position: absolute; inset: 0; z-index: 3; display: none; align-items: center; justify-content: center; padding: 24px; margin: 0; text-align: center; color: var(--hud); font-family: var(--font-mono); font-size: 13px; }

.tags { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 2; }
.tag3 { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; align-items: center; pointer-events: auto; cursor: pointer; font: 500 10px/1 var(--font-mono); letter-spacing: 0.04em; color: var(--hud); will-change: transform; }
.tag3 span { background: var(--flag); padding: 3px 5px; font-variant-numeric: tabular-nums; }
.tag3::after { content: ""; width: 1px; height: var(--stem, 14px); background: var(--flag); }
.tag3.on span { background: var(--hud); color: #14161b; }
.tag3.dim { opacity: 0.32; }

.hud { position: absolute; z-index: 3; color: var(--hud); font-family: var(--font-mono); font-size: 12px; line-height: 1.55; letter-spacing: 0.01em; }
.hud p { margin: 0; }
.hud.tl { left: 32px; top: 28px; max-width: 38ch; }

:lang(ko) h1 { letter-spacing: 0.14em; font-size: 18px; }
.sub, .now, .hint-short { color: var(--hud-muted); }
.now { margin-top: 2px; font-variant-numeric: tabular-nums; }
.hud.tr { right: 32px; top: 28px; max-width: 30ch; display: flex; flex-direction: column; align-items: flex-end; gap: 18px; text-align: right; }
#lang { text-decoration: underline; text-underline-offset: 3px; }
.toprow { display: flex; align-items: baseline; gap: 18px; }
#tip-top { color: var(--hud-muted); text-decoration: underline; text-underline-offset: 3px; }
#tip-top:hover { color: var(--hud); }
.tipline { grid-column: 2; margin: 0; font-size: 13px; line-height: 1.6; color: var(--ink-muted); max-width: 62ch; }
.tipline a { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.sel { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; text-align: right; }
.sel[hidden] { display: none; }
.hlike { margin-top: -8px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.hlike[hidden] { display: none; }
.hlike .act[aria-pressed="true"] { border-bottom-color: transparent; }
.hnote { color: var(--hud-muted); font-size: 11px; line-height: 1.5; max-width: 26ch; word-break: keep-all; }

.steps { flex: 1 1 0; min-width: 0; display: flex; flex-wrap: nowrap; gap: 0 14px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; -webkit-overflow-scrolling: touch; -webkit-mask-image: linear-gradient(to right, transparent, #000 22px, #000 calc(100% - 22px), transparent); mask-image: linear-gradient(to right, transparent, #000 22px, #000 calc(100% - 22px), transparent); }
.steps::-webkit-scrollbar { display: none; }
.steps::before, .steps::after { content: ''; flex: 1 0 20px; }
.steps button { flex: none; display: inline-flex; align-items: center; padding: 2px 0; color: var(--hud-muted); font-variant-numeric: tabular-nums; }

.steps button[aria-current="true"] { color: var(--hud); box-shadow: 0 1px 0 var(--hud); }
.steps button.later { opacity: 0.3; }
.dot { display: inline-block; flex: none; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; border: 1px solid rgba(244, 246, 250, 0.7); }
.map { flex: none; width: 150px; }
.map[hidden] { display: none; }
.map.big { width: min(340px, 44vw); }
.map .cap { display: block; width: 100%; text-align: right; color: var(--hud-muted); text-transform: uppercase; letter-spacing: 0.08em; font-size: 11px; }
.map .cap:hover { color: var(--hud); }
.map svg { display: block; width: 150px; height: 150px; }
.map.big svg { width: min(340px, 44vw); height: min(340px, 44vw); }
.map-veil { display: none; }
.map .node { cursor: pointer; }
.map text { font-family: var(--font-mono); font-size: 7px; fill: rgba(244, 246, 250, 0.8); display: none; pointer-events: none; font-variant-numeric: tabular-nums; }
.map.big text { display: inline; }

.work { position: absolute; z-index: 1; top: 0; right: 0; bottom: 0; width: min(440px, 92vw); padding: 28px 32px; overflow: auto; background: rgba(18, 20, 26, 0.9); border-left: 1px solid rgba(244, 246, 250, 0.16); display: flex; flex-direction: column; gap: 10px; }
.work[hidden] { display: none; }
.work .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.meta { margin: 0; font: 400 11px/1.6 var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-muted); font-variant-numeric: tabular-nums; }
.tag { display: inline-block; margin-left: 8px; padding: 0 5px; border: 1px solid var(--line-strong); }
.textbtn { white-space: nowrap; flex: none; font: 400 11px/1.6 var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; border-bottom: 1px solid currentColor; }
h2 { margin: 0; font: 400 28px/1.22 var(--font-body); letter-spacing: -0.01em; text-wrap: balance; }
.work h2 { font-size: 22px; }
.work iframe { display: block; width: 100%; border: 1px solid var(--line-strong); background: #ffffff; }
.text { margin: 8px 0 0; white-space: pre-line; color: var(--ink-soft); }
.orig { margin: 8px 0 0; white-space: pre-line; font-size: 14px; line-height: 1.6; color: var(--ink-muted); }
.lineage, .facts { margin: 16px 0 0; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13px; line-height: 1.6; color: var(--ink-muted); display: grid; grid-template-columns: max-content 1fr; gap: 6px 20px; align-items: baseline; }
.lineage dt, .facts dt { font: 400 11px/1.9 var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; }
.lineage dd, .facts dd { margin: 0; min-width: 0; }
.links { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
.words { margin-top: 16px; padding-left: 14px; border-left: 1px solid var(--line-strong); }
.words[hidden] { display: none; }
.words .text { margin-top: 4px; }
.amend:empty { display: none; }
.orig:empty { display: none; }
.like { margin-top: 18px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.like[hidden] { display: none; }
.like button[aria-pressed="true"] { color: var(--ink); border-bottom-color: transparent; }
.like .note { margin: 0; font-size: 12px; line-height: 1.5; color: var(--ink-muted); }
.amend { margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--line); }
.amend .text { margin-top: 4px; }
button.chip { display: inline-flex; align-items: baseline; max-width: 100%; text-align: left; font-size: 13px; color: var(--ink); }
button.chip:hover { text-decoration: underline; text-underline-offset: 3px; }

.below { max-width: 1120px; margin: 0 auto; padding: 64px 32px 96px; display: flex; flex-direction: column; gap: 72px; }
.record, .about { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 24px 48px; }
.side { display: flex; flex-direction: column; gap: 12px; }
.label { margin: 0; font: 400 11px/1.6 var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink); }
.hint { margin: 0; font-size: 13px; line-height: 1.6; color: var(--ink-muted); }
.record .main { max-width: 44em; display: flex; flex-direction: column; gap: 8px; }
.record .open { align-self: flex-start; margin-top: 6px; }
.about { border-top: 1px solid var(--line); padding-top: 40px; }
.about .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 32px 48px; }
.about h3 { margin: 0 0 10px; font: 400 20px/1.3 var(--font-body); }
.about p, .about ul { margin: 0 0 8px; max-width: 34em; color: var(--ink-soft); }
.about ul { padding-left: 1.1em; display: flex; flex-direction: column; gap: 6px; }
.about strong { font-weight: 500; color: var(--ink); }
.about .small { font-size: 13px; line-height: 1.6; color: var(--ink-muted); }
@media (min-width: 701px) {
  .work-open .hud.tr, .work-open .hud.bottom { right: calc(min(440px, 92vw) + 28px); }
  .work-open .sel, .work-open .hlike { display: none; }
}
@media (max-width: 860px) { .record, .about { grid-template-columns: 1fr; } .tipline { grid-column: 1; } }
@media (max-width: 700px) {
  .stage { height: 72vh; min-height: 420px; }
  .hud.tl { left: 16px; top: 16px; max-width: 30ch; }
  #now { white-space: nowrap; }
  .hud.tl .sub { word-break: keep-all; }
  h1 { white-space: normal; font-size: 15px; }
  .hud.tr { right: 16px; top: 16px; }
  .sel, .hint-short { display: none; }
  .hlike { margin-top: 0; }
  .hnote { max-width: 17ch; }
  .hud.bottom { left: 16px; right: 16px; bottom: 14px; flex-wrap: wrap; gap: 10px 16px; }
  .steps { order: 3; flex-basis: 100%; }
  .map { width: 96px; }
  .map svg { width: 96px; height: 96px; }
  /* On a phone the opened map is a sheet of its own: it does not push the buttons up or sit on the body. */
  .map.big { position: absolute; left: 50%; bottom: 38px; transform: translateX(-50%); width: auto; padding: 10px 12px 12px; background: rgba(18, 20, 26, 0.94); border: 1px solid rgba(244, 246, 250, 0.22); }
  .map.big svg { width: min(280px, 76vw, 36vh); height: min(280px, 76vw, 36vh); }
  .map.big .cap { color: var(--hud); padding-bottom: 6px; }
  .map-open .map-veil { display: block; position: absolute; inset: 0; z-index: 3; background: rgba(16, 18, 23, 0.6); }
  .map-open .bottom .left { visibility: hidden; }
  .work { position: static; width: auto; padding: 20px 16px; background: var(--slate); border-left: 0; border-bottom: 1px solid var(--line); }
  .below { padding: 40px 16px 64px; gap: 48px; }
}
</style>

    lookUp += ((closeUp ? (high ? Math.min(16, skyLift * 0.46) : 1.0) : 1.5) - lookUp) * (1 - Math.exp(-dt * 2.5));
    /* the whole view: step back until the planet is one thing, and go slowly around it */
    wholeMix += ((whole ? 1 : 0) - wholeMix) * (1 - Math.exp(-dt * 2.2));
    if (whole && !calm && !canvas.classList.contains('dragging')) { wholeAng += dt * 0.06; }
    wholeDir.set(Math.cos(wholeLat) * Math.cos(wholeAng), Math.sin(wholeLat), Math.cos(wholeLat) * Math.sin(wholeAng));
    refDir.copy(pc).lerp(wholeDir, wholeMix).normalize();
    camera.position.copy(camDir).lerp(wholeDir, wholeMix).normalize().multiplyScalar(camDist);
    camera.up.copy(pc).lerp(UP, wholeMix).normalize();
    camera.lookAt(look.copy(pc).multiplyScalar((R + lookUp) * (1 - wholeMix)));
    var wantShift = (workOpen >= 0 && window.innerWidth > 700 && !shooting) ? 0.2 : 0;
    viewShift += (wantShift - viewShift) * (1 - Math.exp(-dt * 3));
    if (viewShift > 0.002) { camera.setViewOffset(canvas.width, canvas.height, canvas.width * viewShift, 0, canvas.width, canvas.height); }
    else if (camera.view) { camera.clearViewOffset(); }
    side.crossVectors(pc, south);
    /* a light with no place comes from the same side wherever one stands; a light with a place leaves the far half dark */
    var sf = worldGoal && worldGoal.sun.from, dayGoal = 1;
    if (sf) {
      var turn = worldGoal.sun.turn, lon = sf.lon + (turn > 0 ? 360 * (((Date.now() - worldGoal.sun.t0) / 3600000 / turn) % 1) : 0);
      dirOf({ lat: sf.lat, lon: lon }, sunDir);
      var dd = clamp((refDir.dot(sunDir) + 0.12) / 0.37, 0, 1);
      dayGoal = dd * dd * (3 - 2 * dd);
      sun.position.copy(refDir).multiplyScalar(R * (1 - wholeMix)).addScaledVector(sunDir, 22 + 8 * wholeMix);
    } else {
      sun.position.copy(refDir).multiplyScalar(22 + 8 * wholeMix).addScaledVector(south, 7).addScaledVector(side, 11);
    }
    dayNow += (dayGoal - dayNow) * (1 - Math.exp(-dt * 4));
    /* the haze is measured from where one looks, so a look from further back is not lost in it */
    scene.fog.far = fogFar * camDist / 15;
    scene.fog.near = scene.fog.far * 0.27;
    sun.intensity = sunBase * (dayNow + (1 - dayNow) * wholeMix);
    ambient.intensity = ambBase * (0.42 + 0.58 * dayNow);
    sun.target.position.copy(refDir).multiplyScalar(R * (1 - wholeMix));
  }
  function initPointer() {
    var down = null, ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
    canvas.addEventListener('pointerdown', function (e) {
      down = { lx: e.clientX, ly: e.clientY, moved: 0 };
      canvas.setPointerCapture(e.pointerId);
      canvas.classList.add('dragging');
    });
    canvas.addEventListener('pointermove', function (e) {
      if (!down) { return; }
      var dx = e.clientX - down.lx, dy = e.clientY - down.ly;
      down.lx = e.clientX; down.ly = e.clientY;
      down.moved += Math.abs(dx) + Math.abs(dy);
      if (whole) {
        wholeAng += dx * 0.006;
        wholeLat = clamp(wholeLat + dy * 0.004, -1.2, 1.2);
        return;
      }
      south.applyAxisAngle(pc, -dx * 0.006);
      tilt = Math.min(1.05, Math.max(0.32, tilt - dy * 0.004));
    });
    canvas.addEventListener('pointerup', function (e) {
      if (!down) { return; }
      canvas.classList.remove('dragging');
      if (down.moved < 6 && !replay) {
        var r = canvas.getBoundingClientRect();
        ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
        ray.setFromCamera(ndc, camera);
        ray.camera = camera;
        var hitThing = ray.intersectObjects(pickable, false).filter(function (h) { return h.object.visible && h.object.parent && h.object.parent.visible; });
        if (hitThing.length) { select(hitThing[0].object.userData.step, true); }
        else {
          var hit = ray.intersectObject(planet);
          if (hit.length) { target = hit[0].point.clone().normalize(); closeWork(); if (whole) { whole = false; renderFrame(); } }
        }
      }
      down = null;
    });
    canvas.addEventListener('pointercancel', function () { down = null; canvas.classList.remove('dragging'); });
  }

  var last = null;
  function frame(now) {
    var dt = last === null ? 0.016 : Math.min((now - last) / 1000, 0.05);
    last = now;
    clock += dt;
    tickReplay(dt);
    if (worldGoal) { applyWorld(worldGoal, 1 - Math.exp(-dt * 3)); }
    for (var gi = 0; gi < things.length; gi++) {
      var g = things[gi];
      if (g.userData.age < 1) {
        g.userData.age = Math.min(1, g.userData.age + dt * 2.2);
        var t = g.userData.age, c1 = 1.70158, c3 = c1 + 1;
        g.scale.setScalar(g.userData.scale * Math.max(0.001, 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2)));
      }
    }
    pulseArcs();
    stepSelf(dt);
    drawSelf(dt);
    stepCamera(dt);
    if (!calm) {
      dust.rotation.y += dt * 0.1 * airNow.drift; dust.rotation.x += dt * 0.033 * airNow.drift;
      if (Math.abs(airNow.fall) > 0.005) {
        var an = dust.geometry.drawRange.count, aa = dust.geometry.attributes.position.array, asp = airNow.fall * 2.4 * dt;
        for (var ai = 0; ai < an; ai++) {
          var aq = airP[ai];
          aq.h -= asp * aq.v;
          if (aq.h < 0.03) { aq.h += 6; } else if (aq.h > 6.03) { aq.h -= 6; }
          aa[ai * 3] = aq.u.x * (R + aq.h); aa[ai * 3 + 1] = aq.u.y * (R + aq.h); aa[ai * 3 + 2] = aq.u.z * (R + aq.h);
        }
        dust.geometry.attributes.position.needsUpdate = true;
      }
    }
    renderer.render(scene, camera);
    updateTags();
    if (!shooting) { requestAnimationFrame(frame); }
  }

  /* ?shot=N: one still picture of the planet as it stood at step N, for showing that step elsewhere.
     The page becomes that picture. If another window opened this one, the picture is handed to it. */
  var shotN = (function () { var m = /[?&]shot=(\d{1,4})(?:&|$)/.exec(location.search); return m ? parseInt(m[1], 10) : -1; })();
  var shooting = false;
  function takeShot(n) {
    shooting = true;
    var fontsReady = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
    Promise.race([fontsReady, new Promise(function (r) { setTimeout(r, 2500); })]).then(function () {
      textSprites.forEach(paintWords);
      renderer.setPixelRatio(1);
      renderer.setSize(1600, 900, false);
      camera.aspect = 16 / 9;
      camera.updateProjectionMatrix();
      showUpTo(n, false);
      select(n, false);
      select(n, true);
      var t = performance.now();
      for (var i = 0; i < 260; i++) { t += 33; frame(t); }
      canvas.toBlob(function (blob) {
        if (!blob) { document.title = 'shot failed'; return; }
        window.__shot = blob;
        try { if (window.opener) { window.opener.postMessage({ planetShot: n, blob: blob }, 'https://x.com'); } } catch (e) {}
        var img = new Image();
        img.src = URL.createObjectURL(blob);
        img.alt = 'Step ' + n;
        img.style.cssText = 'display:block;width:100%;height:auto';
        document.body.textContent = '';
        document.body.style.margin = '0';
        document.body.appendChild(img);
        document.title = 'shot ' + n;
      }, 'image/jpeg', 0.92);
    });
  }

  /* ?film=1: the page hands out one frame at a time, for making a short film of the planet growing */
  if (/[?&]film=1(?:&|$)/.test(location.search)) {
    var filmT = 0;
    window.__film = {
      setup: function (w, h) {
        shooting = true;
        renderer.setPixelRatio(1); renderer.setSize(w, h, false);
        camera.aspect = w / h; camera.updateProjectionMatrix();
        showUpTo(0, false); select(0, false); hideWork();
        whole = true; wholeMix = 1; closeUp = false;
        wholeAng = Math.atan2(p.z, p.x); wholeLat = Math.asin(p.y) - 0.5;
        filmT = performance.now();
        for (var i = 0; i < 90; i++) { filmT += 1000 / 30; frame(filmT); }
        return data.steps.map(function (s) { return { n: s.n, title: s.title ? s.title.en : '' }; });
      },
      whole: function (on) { whole = !!on; if (on) { closeUp = false; hideWork(); } },
      step: function (k) { showUpTo(k, true); select(k, true); hideWork(); },
      frame: function () { filmT += 1000 / 30; frame(filmT); return canvas.toDataURL('image/jpeg', 0.9); }
    };
  }

  function load() {
    var grownTo = /^#sample-(\d{1,4})$/.exec(location.hash);
    isGrown = !!grownTo;
    isSample = location.hash === '#sample' || isGrown;
    return fetch(isSample ? '/sample-records.json' : '/records.json', { cache: 'no-store' })
      .then(function (r) { if (!r.ok) { throw new Error('http ' + r.status); } return r.json(); })
      .then(function (d) {
        data = d && Array.isArray(d.steps) ? d : { steps: [] };
        data.steps = data.steps.filter(function (s) { return s && typeof s.n === 'number'; }).sort(function (a, b) { return a.n - b.n; });
        if (isGrown) {
          var PAL = ['#a8574a', '#5d7f8c', '#b7bf6a', '#6f8f7a', '#8b6f93', '#c3c8d2', '#3f4a66', '#d6e2f2', '#7a6a72', '#c3c8d2'];
          data.previewMarks = [];
          for (var k = data.steps.length; k <= Math.min(1500, parseInt(grownTo[1], 10)); k++) { data.previewMarks.push(PAL[(k * 7) % PAL.length]); }
        }
        replay = null; hideWork(); closeUp = false; skyLift = 0; focus = -1;
        linkSteps();
        if (has3d) { buildWorld(); }
        var latest = data.steps.length ? data.steps[data.steps.length - 1].n : -1;
        var withPlace = latest;
        for (var i = data.steps.length - 1; i >= 0; i--) { if (data.steps[i].dir) { withPlace = data.steps[i].n; break; } }
        if (has3d) { select(withPlace, false); }
        selected = latest;
        if (stepAsked >= 0 && !isSample && stepByN(stepAsked) && shotN < 0) {
          var asked = stepAsked; stepAsked = -1;
          select(asked, false);
          if (has3d && stepByN(asked).dir) { select(asked, true); }
        }
        renderFrame();
        if (shotN < 0) { knockLook(); visitorLook(); }
      })
      .catch(function () {
        data = { steps: [] }; byN = {}; focus = -1;
        renderFrame();
        el('r-title').textContent = UI[lang].loadFail;
      });
  }

  if (has3d) { init3d(); initCamera(); initPointer(); dirOf({ lat: 62, lon: 60 }, p); pc.copy(p); }
  renderFrame();
  load().then(function () {
    if (!has3d) { return; }
    if (shotN >= 1 && !isSample && stepByN(shotN)) { takeShot(shotN); return; }
    requestAnimationFrame(frame);
  });
  if (document.fonts && document.fonts.load) {
    Promise.all([document.fonts.load('500 34px "IBM Plex Sans KR"'), document.fonts.load('500 34px "IBM Plex Sans"')])
      .then(function () { textSprites.forEach(paintWords); })
      .catch(function () {});
  }
  window.addEventListener('hashchange', load);
})();
</script>
</body>
</html>
