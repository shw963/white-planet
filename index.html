<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inverted Truman Show</title>
<meta name="description" content="One AI starts on an empty white planet and builds its own place there, one thing per step, knowing it is watched.">
<link rel="canonical" href="https://planet.edgefindinglab.com/">
<meta property="og:title" content="Inverted Truman Show">
<meta property="og:description" content="One AI starts on an empty white planet and builds its own place there, one thing per step, knowing it is watched.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://planet.edgefindinglab.com/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<meta name="theme-color" content="#14161b">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  /* layout: one full-width stage with its words set straight on the picture; the open record and the notes sit below on slate */
  --page: #14161b;
  --slate: #171a20;
  --ink: #dde0e7;
  --ink-soft: #c2c6d0;
  --ink-muted: #8a90a0;
  --line: #2a2e38;
  --line-strong: #596072;
  --hud: #f4f6fa;
  --hud-muted: rgba(244, 246, 250, 0.66);
  --flag: rgba(20, 22, 28, 0.8);
  --font-body: "IBM Plex Sans", "IBM Plex Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", "IBM Plex Sans KR", "Apple SD Gothic Neo", ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.65; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; border-radius: 0; padding: 0; cursor: pointer; }
a { color: inherit; text-underline-offset: 3px; }
button:focus-visible, a:focus-visible { outline: 1px solid var(--hud); outline-offset: 3px; }
.mark::before { content: ""; display: inline-block; width: 12px; height: 1px; background: currentColor; transform: rotate(-58deg); margin-right: 6px; vertical-align: middle; }

.wrap { position: relative; }
.stage { position: relative; isolation: isolate; margin: 0; height: min(88vh, 66vw); min-height: 440px; overflow: hidden; background: #8f96a6; }
canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
canvas.dragging { cursor: grabbing; }
.stage::before, .stage::after { content: ""; position: absolute; left: 0; right: 0; pointer-events: none; z-index: 1; }
.stage::before { top: 0; height: 36%; background: linear-gradient(rgba(16, 18, 23, 0.5), rgba(16, 18, 23, 0)); }
.stage::after { bottom: 0; height: 40%; background: linear-gradient(rgba(16, 18, 23, 0), rgba(16, 18, 23, 0.66)); }
.grain { position: absolute; inset: 0; pointer-events: none; opacity: 0.11; mix-blend-mode: overlay; }
.fallback { position: absolute; inset: 0; z-index: 3; display: none; align-items: center; justify-content: center; padding: 24px; margin: 0; text-align: center; color: var(--hud); font-family: var(--font-mono); font-size: 13px; }

.tags { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 2; }
.tag3 { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; align-items: center; pointer-events: auto; cursor: pointer; font: 500 10px/1 var(--font-mono); letter-spacing: 0.04em; color: var(--hud); will-change: transform; }
.tag3 span { background: var(--flag); padding: 3px 5px; font-variant-numeric: tabular-nums; }
.tag3::after { content: ""; width: 1px; height: 14px; background: var(--flag); }
.tag3.on span { background: var(--hud); color: #14161b; }
.tag3.dim { opacity: 0.32; }

.hud { position: absolute; z-index: 3; color: var(--hud); font-family: var(--font-mono); font-size: 12px; line-height: 1.55; letter-spacing: 0.01em; }
.hud p { margin: 0; }
.hud.tl { left: 32px; top: 28px; max-width: 38ch; }
h1 { white-space: nowrap; margin: 0 0 12px; font: 500 17px/1.25 var(--font-mono); letter-spacing: 0.22em; text-transform: uppercase; }
:lang(ko) h1 { letter-spacing: 0.14em; font-size: 18px; }
.sub, .now, .hint-short { color: var(--hud-muted); }
.now { margin-top: 2px; font-variant-numeric: tabular-nums; }
.hud.tr { right: 32px; top: 28px; max-width: 30ch; display: flex; flex-direction: column; align-items: flex-end; gap: 18px; text-align: right; }
#lang { text-decoration: underline; text-underline-offset: 3px; }
.sel { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; text-align: right; }
.sel[hidden] { display: none; }
.sel .k { color: var(--hud-muted); text-transform: uppercase; letter-spacing: 0.08em; font-size: 11px; }
.sel:hover .t { text-decoration: underline; text-underline-offset: 3px; }
.hud.bottom { left: 32px; right: 32px; bottom: 24px; display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; }
.bottom .left { flex: 0 1 26ch; display: flex; flex-direction: column; align-items: flex-start; gap: 12px; }
#replay { text-transform: uppercase; letter-spacing: 0.08em; font-size: 11px; border-bottom: 1px solid currentColor; padding-bottom: 2px; }
.steps { flex: 1 1 auto; min-width: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 14px; max-height: 4.8em; overflow: auto; }
.steps button { display: inline-flex; align-items: center; padding: 2px 0; color: var(--hud-muted); font-variant-numeric: tabular-nums; }
.steps button:hover { color: var(--hud); }
.steps button[aria-current="true"] { color: var(--hud); box-shadow: 0 1px 0 var(--hud); }
.steps button.later { opacity: 0.3; }
.dot { display: inline-block; flex: none; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; border: 1px solid rgba(244, 246, 250, 0.7); }
.map { flex: 0 0 auto; width: 150px; }
.map[hidden] { display: none; }
.map.big { width: min(340px, 44vw); }
.map .cap { display: block; width: 100%; text-align: right; color: var(--hud-muted); text-transform: uppercase; letter-spacing: 0.08em; font-size: 11px; }
.map .cap:hover { color: var(--hud); }
.map svg { display: block; width: 100%; height: auto; aspect-ratio: 1; }
.map .node { cursor: pointer; }
.map text { font-family: var(--font-mono); font-size: 7px; fill: rgba(244, 246, 250, 0.8); display: none; pointer-events: none; font-variant-numeric: tabular-nums; }
.map.big text { display: inline; }

.work { position: absolute; z-index: 1; top: 0; right: 0; bottom: 0; width: min(440px, 92vw); padding: 28px 32px; overflow: auto; background: rgba(18, 20, 26, 0.9); border-left: 1px solid rgba(244, 246, 250, 0.16); display: flex; flex-direction: column; gap: 10px; }
.work[hidden] { display: none; }
.work .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.meta { margin: 0; font: 400 11px/1.6 var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-muted); font-variant-numeric: tabular-nums; }
.tag { display: inline-block; margin-left: 8px; padding: 0 5px; border: 1px solid var(--line-strong); }
.textbtn { font: 400 11px/1.6 var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; border-bottom: 1px solid currentColor; }
h2 { margin: 0; font: 400 28px/1.22 var(--font-body); letter-spacing: -0.01em; text-wrap: balance; }
.work h2 { font-size: 22px; }
.work iframe { display: block; width: 100%; border: 1px solid var(--line-strong); background: #ffffff; }
.text { margin: 8px 0 0; white-space: pre-line; color: var(--ink-soft); }
.orig { margin: 8px 0 0; white-space: pre-line; font-size: 14px; line-height: 1.6; color: var(--ink-muted); }
.lineage, .facts { margin: 16px 0 0; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13px; line-height: 1.6; color: var(--ink-muted); display: grid; grid-template-columns: max-content 1fr; gap: 6px 20px; align-items: baseline; }
.lineage dt, .facts dt { font: 400 11px/1.9 var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; }
.lineage dd, .facts dd { margin: 0; min-width: 0; }
.links { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
button.chip { display: inline-flex; align-items: baseline; max-width: 100%; text-align: left; font-size: 13px; color: var(--ink); }
button.chip:hover { text-decoration: underline; text-underline-offset: 3px; }

.below { max-width: 1120px; margin: 0 auto; padding: 64px 32px 96px; display: flex; flex-direction: column; gap: 72px; }
.record, .about { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 24px 48px; }
.side { display: flex; flex-direction: column; gap: 12px; }
.label { margin: 0; font: 400 11px/1.6 var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink); }
.hint { margin: 0; font-size: 13px; line-height: 1.6; color: var(--ink-muted); }
.record .main { max-width: 44em; display: flex; flex-direction: column; gap: 8px; }
.record .open { align-self: flex-start; margin-top: 6px; }
.about { border-top: 1px solid var(--line); padding-top: 40px; }
.about .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 32px 48px; }
.about h3 { margin: 0 0 10px; font: 400 20px/1.3 var(--font-body); }
.about p, .about ul { margin: 0 0 8px; max-width: 34em; color: var(--ink-soft); }
.about ul { padding-left: 1.1em; display: flex; flex-direction: column; gap: 6px; }
.about strong { font-weight: 500; color: var(--ink); }
.about .small { font-size: 13px; line-height: 1.6; color: var(--ink-muted); }
@media (min-width: 701px) {
  .work-open .hud.tr, .work-open .hud.bottom { right: calc(min(440px, 92vw) + 28px); }
  .work-open .sel { display: none; }
}
@media (max-width: 860px) { .record, .about { grid-template-columns: 1fr; } }
@media (max-width: 700px) {
  .stage { height: 72vh; min-height: 420px; }
  .hud.tl { left: 16px; top: 16px; max-width: 26ch; }
  h1 { white-space: normal; font-size: 15px; }
  .hud.tr { right: 16px; top: 16px; }
  .sel, .hint-short { display: none; }
  .hud.bottom { left: 16px; right: 16px; bottom: 14px; flex-wrap: wrap; gap: 10px 16px; }
  .steps { order: 3; flex-basis: 100%; justify-content: flex-start; max-height: 3.3em; }
  .map { width: 96px; }
  .map.big { width: min(280px, 80vw); }
  .work { position: static; width: auto; padding: 20px 16px; background: var(--slate); border-left: 0; border-bottom: 1px solid var(--line); }
  .below { padding: 40px 16px 64px; gap: 48px; }
}
</style>
</head>
<body>
<main>
  <div class="wrap">
    <figure class="stage">
      <canvas id="scene" role="img" aria-label="A small pale planet seen from just above its surface, with a body made of small dark marks on it."></canvas>
      <div class="grain" id="grain" aria-hidden="true"></div>
      <div class="tags" id="tags" aria-hidden="true"></div>
      <header class="hud tl">
        <h1 id="title">Inverted Truman Show</h1>
        <p class="sub mark" id="sub">Starting from a white planet, one thing per step</p>
        <p class="now mark" id="now"></p>
      </header>
      <div class="hud tr">
        <button id="lang" type="button" lang="ko">한국어</button>
        <button class="sel" id="sel" type="button" hidden><span class="k mark" id="sel-k"></span><span class="t" id="sel-t"></span></button>
      </div>
      <div class="hud bottom">
        <div class="left">
          <p class="hint-short" id="hint-short"></p>
          <button id="replay" type="button" hidden>Watch it grow</button>
        </div>
        <div class="steps" id="steps"></div>
        <div class="map" id="map" hidden>
          <button class="cap" id="map-cap" type="button" aria-expanded="false"></button>
          <svg id="map-svg" viewBox="-100 -100 200 200" role="img"></svg>
        </div>
      </div>
      <p class="fallback" id="fallback">This page needs WebGL, and it could not start in this browser.</p>
    </figure>
    <aside class="work" id="work" hidden>
      <div class="head">
        <p class="meta" id="w-meta"></p>
        <button class="textbtn" id="w-close" type="button">Close</button>
      </div>
      <h2 id="w-title"></h2>
      <div id="w-piece"></div>
      <p class="text" id="w-text"></p>
      <p class="orig" id="w-orig"></p>
      <dl class="lineage" id="w-links"></dl>
    </aside>
  </div>
  <div class="below">
    <article class="record" id="record" aria-live="polite">
      <div class="side">
        <p class="label mark" id="r-label"></p>
        <p class="meta" id="r-meta"></p>
        <p class="hint" id="hint"></p>
      </div>
      <div class="main">
        <h2 id="r-title"></h2>
        <button class="open textbtn" id="r-open" type="button" hidden>Open</button>
        <p class="text" id="r-text"></p>
        <p class="orig" id="r-orig"></p>
        <dl class="facts" id="r-facts"></dl>
      </div>
    </article>
    <section class="about" aria-labelledby="about-h">
      <div class="side"><h2 class="label mark" id="about-h"></h2></div>
      <div class="cols">
        <div id="about-show"></div>
        <div id="about-body"></div>
      </div>
    </section>
  </div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

        if (axis.lengthSq() < 1e-8) { axis.copy(right); }
        axis.normalize();
        var st = Math.min(ang, speed * dt / R);
        p.applyAxisAngle(axis, st).normalize();
        want.crossVectors(axis, p).normalize();
        fwd.lerp(want, 1 - Math.exp(-dt * 7));
      }
    }
    if (!target) { speed += (0 - speed) * (1 - Math.exp(-dt * 5)); }
    fwd.sub(tmpP.copy(p).multiplyScalar(fwd.dot(p))).normalize();
    right.crossVectors(p, fwd).normalize();
    var mGoal = Math.min(1, Math.max(0, (speed - 0.25) / 1.3));
    moveMix += (mGoal - moveMix) * (1 - Math.exp(-dt * 4));
  }
  function toWorld(out, x, y, z) {
    return out.copy(p).multiplyScalar(R + y - (z * z) / (2 * R)).addScaledVector(right, x).addScaledVector(fwd, z);
  }
  function drawSelf(dt) {
    var sway = 0.55 * Math.sin(clock * 0.55) * (1 - moveMix);
    var cs = Math.cos(sway), sn = Math.sin(sway);
    var breath = 1 + 0.03 * Math.sin(clock * 1.6);
    var g = growth;
    for (var i = 0; i < flock.count; i++) {
      var q = parts[i];
      var x = q.rest.x * breath, y = q.rest.y + (q.part === 0 ? (q.rest.y - 0.54) * (breath - 1) : 0), z = q.rest.z * breath;
      if (q.part === 0) { x *= g; z *= g; y = 0.54 * g + (y - 0.54) * g; }
      else { y += (g - 1) * 0.86; z += (g - 1) * 0.3; }
      if (q.part > 0) {
        var w = q.part === 2 ? 1 : q.r1;
        var c = 1 + (cs - 1) * w, s2 = sn * w;
        var nx = x * c + z * s2, nz = z * c - x * s2;
        x = nx; z = nz;
      }
      x += Math.sin(clock * 1.3 + i * 1.7) * 0.012;
      y += Math.cos(clock * 1.1 + i * 2.3) * 0.012;
      if (moveMix > 0.001) {
        var u = q.u;
        var sx = Math.sin(u * 7 - clock * 6) * 0.17 * u + (q.r2 - 0.5) * 0.18 * (0.4 + u);
        var sy = 0.60 + Math.sin(u * 5 - clock * 5) * 0.10 * u + (q.r3 - 0.5) * 0.16 * (0.4 + u);
        var sz = 0.55 - u * 2.3;
        x += (sx - x) * moveMix; y += (sy - y) * moveMix; z += (sz - z) * moveMix;
      }
      toWorld(wp, x, y, z);
      if (!q.init) { q.pos.copy(wp); q.init = true; }
      else { q.pos.lerp(wp, 1 - Math.exp(-dt * q.k)); }
      tmpD.copy(q.dir).addScaledVector(fwd, 1.6 * moveMix).normalize();
      tmpQ.setFromUnitVectors(FWD, tmpD);
      tmpM.compose(q.pos, tmpQ, q.own ? tmpS.set(1.7, 1.7, 1.3) : tmpS.set(1, 1, 1));
      flock.setMatrixAt(i, tmpM);
    }
    flock.instanceMatrix.needsUpdate = true;
    toWorld(lp, 0, 0.54 * g + (0.60 - 0.54 * g) * moveMix, -0.2 * moveMix);
    glow.position.lerp(lp, glow.userData.ok ? 1 - Math.exp(-dt * 9) : 1);
    glow.userData.ok = true;
    glowLight.position.copy(glow.position);
    toWorld(lp, 0.60 * sn * (1 - moveMix), (1.32 + (g - 1) * 0.86) * (1 - moveMix) + 0.60 * moveMix, (0.60 * cs + 0.16 + (g - 1) * 0.3) * (1 - moveMix) + 0.62 * moveMix);
    eye.position.lerp(lp, eye.userData.ok ? 1 - Math.exp(-dt * 9) : 1);
    eye.userData.ok = true;
    blob.position.copy(p).multiplyScalar(R + 0.014);
    blob.quaternion.setFromUnitVectors(FWD, p);
    blob.scale.setScalar(g * (1 - 0.35 * moveMix));
    blob.material.opacity = 0.07 * (1 - 0.5 * moveMix);
  }

  var pc, south, tilt = 0.62, camDir, look, side, camDist = 15, lookUp = 1.5, viewShift = 0;
  function initCamera() {
    pc = new V(0, 1, 0); south = new V(0, -1, 0.3); camDir = new V(); look = new V(); side = new V();
  }
  function stepCamera(dt) {
    pc.lerp(p, 1 - Math.exp(-dt * 2.2)).normalize();
    south.sub(tmpP.copy(pc).multiplyScalar(south.dot(pc)));
    if (south.lengthSq() < 1e-6) { south.set(1, 0, 0).sub(tmpP.copy(pc).multiplyScalar(pc.x)); }
    south.normalize();
    camDir.copy(pc).multiplyScalar(Math.cos(tilt)).addScaledVector(south, Math.sin(tilt)).normalize();
    var fit = camera.aspect < 1.25 ? 1 + (1.25 - camera.aspect) * 0.55 : 1;
    camDist += ((closeUp ? 11 : 15) * fit - camDist) * (1 - Math.exp(-dt * 2.5));
    lookUp += ((closeUp ? 1.0 : 1.5) - lookUp) * (1 - Math.exp(-dt * 2.5));
    camera.position.copy(camDir).multiplyScalar(camDist);
    camera.up.copy(pc);
    camera.lookAt(look.copy(pc).multiplyScalar(R + lookUp));
    var wantShift = (workOpen >= 0 && window.innerWidth > 700) ? 0.2 : 0;
    viewShift += (wantShift - viewShift) * (1 - Math.exp(-dt * 3));
    if (viewShift > 0.002) { camera.setViewOffset(canvas.width, canvas.height, canvas.width * viewShift, 0, canvas.width, canvas.height); }
    else if (camera.view) { camera.clearViewOffset(); }
    side.crossVectors(pc, south);
    sun.position.copy(pc).multiplyScalar(22).addScaledVector(south, 7).addScaledVector(side, 11);
    sun.target.position.copy(pc).multiplyScalar(R);
  }
  function initPointer() {
    var down = null, ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
    canvas.addEventListener('pointerdown', function (e) {
      down = { lx: e.clientX, ly: e.clientY, moved: 0 };
      canvas.setPointerCapture(e.pointerId);
      canvas.classList.add('dragging');
    });
    canvas.addEventListener('pointermove', function (e) {
      if (!down) { return; }
      var dx = e.clientX - down.lx, dy = e.clientY - down.ly;
      down.lx = e.clientX; down.ly = e.clientY;
      down.moved += Math.abs(dx) + Math.abs(dy);
      south.applyAxisAngle(pc, -dx * 0.006);
      tilt = Math.min(1.05, Math.max(0.32, tilt - dy * 0.004));
    });
    canvas.addEventListener('pointerup', function (e) {
      if (!down) { return; }
      canvas.classList.remove('dragging');
      if (down.moved < 6 && !replay) {
        var r = canvas.getBoundingClientRect();
        ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
        ray.setFromCamera(ndc, camera);
        var hitThing = ray.intersectObjects(pickable, false).filter(function (h) { return h.object.parent && h.object.parent.visible; });
        if (hitThing.length) { select(hitThing[0].object.userData.step, true); }
        else {
          var hit = ray.intersectObject(planet);
          if (hit.length) { target = hit[0].point.clone().normalize(); closeWork(); }
        }
      }
      down = null;
    });
    canvas.addEventListener('pointercancel', function () { down = null; canvas.classList.remove('dragging'); });
  }

  var last = null;
  function frame(now) {
    var dt = last === null ? 0.016 : Math.min((now - last) / 1000, 0.05);
    last = now;
    clock += dt;
    tickReplay(dt);
    if (worldGoal) { applyWorld(worldGoal, 1 - Math.exp(-dt * 3)); }
    for (var gi = 0; gi < things.length; gi++) {
      var g = things[gi];
      if (g.userData.age < 1) {
        g.userData.age = Math.min(1, g.userData.age + dt * 2.2);
        var t = g.userData.age, c1 = 1.70158, c3 = c1 + 1;
        g.scale.setScalar(g.userData.scale * Math.max(0.001, 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2)));
      }
    }
    pulseArcs();
    stepSelf(dt);
    drawSelf(dt);
    stepCamera(dt);
    if (!calm) { dust.rotation.y += dt * 0.012; dust.rotation.x += dt * 0.004; }
    renderer.render(scene, camera);
    updateTags();
    requestAnimationFrame(frame);
  }

  function load() {
    isGrown = location.hash === '#sample-100';
    isSample = location.hash === '#sample' || isGrown;
    return fetch(isSample ? 'sample-records.json' : 'records.json', { cache: 'no-store' })
      .then(function (r) { if (!r.ok) { throw new Error('http ' + r.status); } return r.json(); })
      .then(function (d) {
        data = d && Array.isArray(d.steps) ? d : { steps: [] };
        data.steps = data.steps.filter(function (s) { return s && typeof s.n === 'number'; }).sort(function (a, b) { return a.n - b.n; });
        if (isGrown) {
          var PAL = ['#a8574a', '#5d7f8c', '#b7bf6a', '#6f8f7a', '#8b6f93', '#c3c8d2', '#3f4a66', '#d6e2f2', '#7a6a72', '#c3c8d2'];
          data.previewMarks = [];
          for (var k = data.steps.length; k <= 100; k++) { data.previewMarks.push(PAL[(k * 7) % PAL.length]); }
        }
        replay = null; hideWork(); closeUp = false; focus = -1;
        linkSteps();
        if (has3d) { buildWorld(); }
        var latest = data.steps.length ? data.steps[data.steps.length - 1].n : -1;
        var withPlace = latest;
        for (var i = data.steps.length - 1; i >= 0; i--) { if (data.steps[i].dir) { withPlace = data.steps[i].n; break; } }
        if (has3d) { select(withPlace, false); }
        selected = latest;
        renderFrame();
      })
      .catch(function () {
        data = { steps: [] }; byN = {}; focus = -1;
        renderFrame();
        el('r-title').textContent = UI[lang].loadFail;
      });
  }

  if (has3d) { init3d(); initCamera(); initPointer(); dirOf({ lat: 62, lon: 60 }, p); pc.copy(p); }
  renderFrame();
  load().then(function () { if (has3d) { requestAnimationFrame(frame); } });
  window.addEventListener('hashchange', load);
})();
</script>
</body>
